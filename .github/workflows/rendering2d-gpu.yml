name: Rendering2D GPU Validation

on:
  workflow_dispatch:
    inputs:
      native_product_acceptance:
        description: Run GPU products with the selected BGCS toolchain
        type: boolean
        default: true
      engine_ref:
        description: Optional InnoEngine revision override; defaults to the tested authoring API revision
        required: false
  pull_request:
    paths:
      - ".github/workflows/rendering2d-gpu.yml"
      - "Assets/**"
      - "Tools/**"
      - "Tests/**"
      - "Settings.*.inno"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rendering2d-gpu.yml"
      - "Assets/**"
      - "Tools/**"
      - "Tests/**"
      - "Settings.*.inno"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  INNO_ENGINE_REF: "76ee62807bd164ad1935a6d93e9f00633670867a"

jobs:
  windows-gpu:
    if: github.event_name != 'workflow_dispatch' || inputs.native_product_acceptance
    name: Windows x64 / ${{ matrix.backend }}
    runs-on: [self-hosted, Windows, X64, gpu]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [d3d11, d3d12, vulkan]

    steps:
      - name: Checkout Rendering2D
        uses: actions/checkout@v4
        with:
          path: Rendering2D

      - name: Checkout matching InnoEngine
        uses: actions/checkout@v4
        with:
          repository: Wolfiora/InnoEngine
          ref: ${{ inputs.engine_ref || env.INNO_ENGINE_REF }}
          submodules: recursive
          path: InnoEngine

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: InnoEngine/global.json

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run GPU validation
        shell: pwsh
        working-directory: Rendering2D
        run: >-
          ./Tools/Validate-Rendering2D.ps1
          -EngineRoot ../InnoEngine
          -Backend ${{ matrix.backend }}
          -SmokeFrames 3000

      - name: Upload GPU validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering2d-windows-${{ matrix.backend }}
          path: Rendering2D/Logs/**
          if-no-files-found: warn

  metal-gpu:
    if: github.event_name != 'workflow_dispatch' || inputs.native_product_acceptance
    name: macOS arm64 / Metal
    runs-on: [self-hosted, macOS, ARM64, gpu]
    timeout-minutes: 90

    steps:
      - name: Checkout Rendering2D
        uses: actions/checkout@v4
        with:
          path: Rendering2D

      - name: Checkout matching InnoEngine
        uses: actions/checkout@v4
        with:
          repository: Wolfiora/InnoEngine
          ref: ${{ inputs.engine_ref || env.INNO_ENGINE_REF }}
          submodules: recursive
          path: InnoEngine

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: InnoEngine/global.json

      - name: Run Metal GPU validation
        shell: bash
        working-directory: Rendering2D
        env:
          DOTNET_COMMAND: dotnet
        run: ./Tools/Validate-Rendering2D.sh ../InnoEngine 3000

      - name: Upload GPU validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering2d-metal
          path: Rendering2D/Logs/**
          if-no-files-found: warn
